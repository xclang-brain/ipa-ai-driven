[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docmig"
version = "0.1.0"
description = "Word / Excel の既存ドキュメントを、AI が参照できる Markdown に移行するためのツール"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "pypdfium2>=4.30",
    "Pillow>=10.0",
]

[project.optional-dependencies]
# Excel を使った描画（Windows のみ）
excel = ["pywin32>=306; sys_platform == 'win32'"]
dev = ["pytest>=8.0"]

[project.scripts]
docmig = "docmig.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
